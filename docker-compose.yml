services:
  nginx:
    image: owasp/modsecurity-crs:nginx
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      MODSEC_RULE_ENGINE: DetectionOnly
      PARANOIA: 2
      BLOCKING_PARANOIA: 2
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - aura
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      NODE_ENV: ${NODE_ENV}
      GRAPHQL_URL: ${GRAPHQL_URL}
    depends_on:
      - backend
    networks:
      - aura
    restart: unless-stopped

  backend:
    build: ./backend
    group_add:
      - '${HOST_GID:-1000}'
    volumes:
      - ./backend/prisma:/app/prisma
      - product_uploads:/app/uploads
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3001
      POSTGRES_URL: ${POSTGRES_URL}
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID}
      VAULT_SECRET_ID_FILE: /run/secrets/vault_secret_id
      VAULT_SECRET_PATH: aura-backend/development
      VAULT_KV_MOUNT: secret
      VAULT_AUTH_PATH: approle
      VAULT_REQUEST_TIMEOUT_MS: '10000'
    secrets:
      - vault_secret_id
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      vault:
        condition: service_healthy
    networks:
      - aura
      - vault
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aura
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - '${REDIS_PORT}:6379'
    networks:
      - aura
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.19
    command:
      - server
      - -dev
      - -dev-listen-address=0.0.0.0:8200
      - -dev-root-token-id=${VAULT_DEV_ROOT_TOKEN_ID}
      - -dev-no-store-token
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_ADDR: ${VAULT_ADDR}
    volumes:
      - type: bind
        source: ./vault
        target: /vault/aura
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - vault

volumes:
  postgres_data:
  product_uploads:

networks:
  aura:
    driver: bridge

  vault:
    internal: true

secrets:
  vault_secret_id:
    file: ./local-secrets/vault-secret-id
