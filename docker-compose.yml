services:
  nginx:
    image: owasp/modsecurity-crs:nginx
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      MODSEC_RULE_ENGINE: DetectionOnly
      PARANOIA: 2
      BLOCKING_PARANOIA: 2
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - aura
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      NODE_ENV: ${NODE_ENV}
      GRAPHQL_URL: ${GRAPHQL_URL}
    depends_on:
      - backend
    networks:
      - aura
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3001
    depends_on:
      - postgres
      - redis
    networks:
      - aura
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aura
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - '${REDIS_PORT}:6379'
    networks:
      - aura
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  aura:
    driver: bridge
