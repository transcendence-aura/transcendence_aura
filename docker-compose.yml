services:
  frontend:
    build: ./frontend
    ports:
      - '${FRONTEND_PORT}:3000'
    environment:
      NODE_ENV: ${NODE_ENV}
    depends_on:
      - backend
    networks:
      - aura
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - '${BACKEND_PORT}:3001'
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3001
    depends_on:
      - postgres
      - redis
    networks:
      - aura
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aura
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - '${REDIS_PORT}:6379'
    networks:
      - aura
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  aura:
    driver: bridge
