# False positive: GraphQL query text triggers CRS rule 932236
SecRule REQUEST_URI "@streq /graphql" \
    "id:10001,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetById=932236;ARGS:json.query"

# GraphQL query text false positive: SQLi rule
SecRule REQUEST_URI "@streq /graphql" \
    "id:10002,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetById=942290;ARGS:json.query"

# GraphQL query text false positive: SQL special-character anomaly
SecRule REQUEST_URI "@streq /graphql" \
    "id:10003,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.query"

# Socket.IO / Engine.IO polling may legitimately use text/plain
SecRule REQUEST_URI "@beginsWith /socket.io/" \
    "id:10004,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_HEADERS:Content-Type "@beginsWith text/plain" \
        "t:none,\
        ctl:ruleRemoveById=920420"
