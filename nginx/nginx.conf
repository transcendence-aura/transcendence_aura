# Reverse Proxy
# Single entry point routing traffic to the frontend and backend.

# Load ModSecurity dynamic module
load_module /usr/lib/nginx/modules/ngx_http_modsecurity_module.so;

# Writeable PID location inside container
pid /tmp/nginx.pid;

events {}

http {
  # Condition to set the Connection header for WebSocket upgrades.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Container DNS (Docker: 127.0.0.11, Podman: network gateway), read from
  # /etc/resolv.conf at startup. Service IPs change when a container restarts
  # (always on Podman), so upstreams are re-resolved instead of cached forever.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=5s;

  # Docker Compose service upstreams
  upstream frontend {
    zone frontend 64k;
    server frontend:3000 resolve;
  }
  upstream backend {
    zone backend 64k;
    server backend:3001 resolve;
  }

  # --- HTTP Server: Redirect all traffic to HTTPS ---
  server {
    listen 8080;
    server_name localhost;

    location / {
        # Host port published for HTTPS (443, or 8443 on rootless Podman).
        return 301 https://$host:${HTTPS_PORT}$request_uri;
    }
  }

  # --- HTTPS Server ---
  server {
    listen 8443 ssl;
    server_name localhost;

    # Enable ModSecurity
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity.d/setup.conf;

    # TLS Configuration (Spec requirement: TLS 1.2/1.3 only)
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Standard proxy headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support --> (Required for Socket.io chat)
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Backend: REST API
    location /api/ {
      # Admin product image uploads (multipart) go through here - nginx's
      # 1m default would reject them well below the app-level 5MB limit.
      client_max_body_size 6m;
      proxy_pass http://backend/;
    }

    # Backend: GraphQL API
    location /graphql {
      proxy_pass http://backend;
    }

    # Backend: WebSocket (Socket.io real-time transport)
    location /socket.io/ {
      proxy_pass http://backend;
    }

    # Frontend: Catch-all (UI and Next.js internals)
    location / {
      proxy_pass http://frontend;
    }
  }
}
