# Single entry point routing traffic to the frontend and backend.

events {}

http {
  # Condition to set the Connection header for WebSocket upgrades.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Docker Compose service upstreams
  upstream frontend {
    server frontend:3000;
  }
  upstream backend {
    server backend:3001;
  }

  server {
    listen 80;
    server_name localhost;

    # Standard proxy headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support --> (Required for Socket.io chat)
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Backend: REST API
    location /api/ {
      proxy_pass http://backend;
    }

    # Backend: GraphQL API
    location /graphql {
      proxy_pass http://backend;
    }

    # Frontend: Catch-all (UI and Next.js internals)
    location / {
      proxy_pass http://frontend;
    }
  }
}
