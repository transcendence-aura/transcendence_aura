# Reverse Proxy
# Single entry point routing traffic to the frontend and backend.

# Load ModSecurity dynamic module
load_module /usr/lib/nginx/modules/ngx_http_modsecurity_module.so;

# Writeable PID location inside container
pid /tmp/nginx.pid;

events {}

http {
  # Condition to set the Connection header for WebSocket upgrades.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Docker Compose service upstreams
  upstream frontend {
    server frontend:3000;
  }
  upstream backend {
    server backend:3001;
  }

  # --- HTTP Server: Redirect all traffic to HTTPS ---
  server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
  }

  # --- HTTPS Server ---
  server {
    listen 443 ssl;
    server_name localhost;

    # Enable ModSecurity
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity.d/setup.conf;

    # TLS Configuration (Spec requirement: TLS 1.2/1.3 only)
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Standard proxy headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support --> (Required for Socket.io chat)
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Backend: REST API
    location /api/ {
      proxy_pass http://backend/;
    }

    # Backend: GraphQL API
    location /graphql {
      proxy_pass http://backend;
    }

    # Frontend: Catch-all (UI and Next.js internals)
    location / {
      proxy_pass http://frontend;
    }
  }
}
